services:
  guardrails:
    # Browser previews exercise NeMo, even when the developer has not enabled its optional profile.
    profiles: !reset []
    environment:
      NEMO_SAFETY_MODEL_URL: http://fixtures:9090/v1
      NEMO_SAFETY_MODEL: test-safety-classifier
  installer:
    build: { context: ., dockerfile: tests/fixtures/linux-installer.Dockerfile }
    image: openharness-installer-test:local
    profiles: ['installer']
    restart: 'no'
  api:
    environment:
      &test-stores # No gateway here, like installs created before machines existed: the configured gateway is trusted on its own.
      ALLOWED_PRIVATE_HOSTS: fixtures,host.docker.internal
      SMTP_TRANSPORT: json
      QDRANT_URL: http://qdrant:6333
      OPENSEARCH_URL: http://opensearch:9200
      ELASTICSEARCH_URL: http://elasticsearch:9200
      OPENAI_VECTOR_STORES_URL: http://fixtures:9090/openai/v1
      OPENAI_VECTOR_STORES_API_KEY: test-vector-stores-key
      # Every test file signs in; the suites together exceed the production limit of 20 per ten minutes.
      LOGIN_RATE_LIMIT: 500
    depends_on: &test-store-services
      qdrant: { condition: service_healthy }
      opensearch: { condition: service_healthy }
      elasticsearch: { condition: service_healthy }
  runner:
    environment: *test-stores
    depends_on: *test-store-services
  # The test stack always runs the optional stores, so every vector store driver is exercised.
  qdrant:
    profiles: !reset []
  opensearch:
    profiles: !reset []
    environment:
      OPENSEARCH_JAVA_OPTS: -Xms256m -Xmx256m -XX:ActiveProcessorCount=2 -XX:MaxDirectMemorySize=256m
  elasticsearch:
    profiles: !reset []
    environment:
      ES_JAVA_OPTS: -Xms256m -Xmx256m
  gateway:
    environment:
      GATEWAY_HEARTBEAT_SECONDS: 5
      GATEWAY_PUBLIC_URL: ws://gateway:8090
  # A Linux machine (the Go connector) with no inbound ports; the integration test starts it after enrolling it.
  device:
    build: { context: ., dockerfile: connector-go/Dockerfile }
    image: openharness-connector:local
    profiles: ['device']
    environment:
      GATEWAY_URL: ws://gateway:8090/connect
      GATEWAY_ALLOW_INSECURE: 'true'
      DEVICE_ID: ${TEST_DEVICE_ID:-test-box}
      DEVICE_TOKEN: ${TEST_DEVICE_TOKEN:-unset}
      ALLOW_COMMANDS: uname,echo,ls,cat
      LOG_LEVEL: debug
    restart: 'no'
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
  # An OpenShell managed machine: the edge against its in-memory OpenShell stand-in, no inbound ports; started by
  # the test. A real deployment runs the edge beside the OpenShell gateway (deploy/openshell).
  openshell-device:
    build: { context: ., dockerfile: connector-go/Dockerfile, target: edge }
    image: openharness-edge:local
    profiles: ['device']
    environment:
      GATEWAY_URL: ws://gateway:8090/connect
      GATEWAY_ALLOW_INSECURE: 'true'
      DEVICE_ID: ${TEST_DEVICE_ID:-test-openshell}
      DEVICE_TOKEN: ${TEST_DEVICE_TOKEN:-unset}
      OPENSHELL_FAKE: 'true'
      OPENSHELL_ALLOWED_IMAGES: registry.example.com/agents/
      OPENSHELL_MAX_SANDBOXES: '5'
      EXECUTOR_IMAGE: registry.example.com/agents/executor:1.0
      LOG_LEVEL: debug
    restart: 'no'
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
  fixtures:
    image: openharness:local
    pull_policy: never
    command: ['node', 'tests/fixtures/server.mjs']
    volumes: ['./tests/fixtures:/app/tests/fixtures:ro']
    ports: ['127.0.0.1:19090:9090']
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:9090/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      retries: 10
