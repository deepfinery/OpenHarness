# Example: FILES_PATH=/mnt/agentic docker compose -f compose.yaml -f compose.shared-fs.yaml up -d
# Mount the same host/NFS directory into the API and every runner. UID 1000 must be able to write.
volumes:
  files:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${FILES_PATH:?Set FILES_PATH to your shared filesystem directory}
