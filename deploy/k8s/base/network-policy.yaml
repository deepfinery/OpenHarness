# Internal services accept traffic only from this namespace. Only the TLS proxy
# accepts inbound traffic from outside it; outbound MCP/model calls remain open.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: internal-services
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: public-proxy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: proxy
  policyTypes: [Ingress]
  ingress:
    - ports:
        - protocol: TCP
          port: 8443
