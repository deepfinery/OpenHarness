# The official MongoDB MCP server over the stack MongoDB. Internal only (no public route): every request needs the
# bearer token that only the app holds, and its database user can only reach workspace databases the app grants.
apiVersion: v1
kind: Service
metadata:
  name: mongodb-mcp
  labels:
    app.kubernetes.io/name: mongodb-mcp
    app.kubernetes.io/part-of: openharness
spec:
  selector:
    app.kubernetes.io/name: mongodb-mcp
    app.kubernetes.io/part-of: openharness
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb-mcp
  labels:
    app.kubernetes.io/name: mongodb-mcp
    app.kubernetes.io/part-of: openharness
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mongodb-mcp
      app.kubernetes.io/part-of: openharness
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mongodb-mcp
        app.kubernetes.io/part-of: openharness
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mongodb-mcp
          image: openharness-mongodb-mcp:local
          ports:
            - containerPort: 3000
            - containerPort: 3001
          env:
            - name: MDB_MCP_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: openharness-secrets
                  key: MDB_MCP_CONNECTION_STRING
            - name: MDB_MCP_HTTP_HEADERS
              valueFrom:
                secretKeyRef:
                  name: openharness-secrets
                  key: MDB_MCP_HTTP_HEADERS
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /health
              port: 3001
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
      volumes:
        - name: tmp
          emptyDir: {}
