apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: openharness
resources:
  - ../../base
patches:
  - target:
      kind: Service
      name: proxy
    patch: |-
      - op: add
        path: /spec/type
        value: LoadBalancer
      - op: replace
        path: /spec/ports/0/port
        value: 443
  # Room for large MongoDB collections. scripts/deploy.sh expands the existing claim in place.
  - target:
      kind: StatefulSet
      name: mongo
    patch: |-
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: 1Ti
images:
