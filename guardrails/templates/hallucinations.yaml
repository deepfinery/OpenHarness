# NeMo Guardrails configuration for the OpenHarness policy adapter.
# Requires the bundled openharness rails.co and actions.py.
# Edit custom_data.openharness.policy; model credentials stay on the service.
models: []
colang_version: '1.0'
rails:
  input:
    flows:
      - openharness policy
  dialog:
    user_messages:
      embeddings_only: true
custom_data:
  openharness:
    version: 1
    policy:
      name: Hallucinations policy
      description: Check answers for unsupported certainty, invented citations, and contradictory claims.
      provider: nemo
      configId: openharness
      stages:
        - output
      failMode: closed
      timeoutMs: 30000
      latencyBudgetMs: 120000
      pii: false
      jailbreak: false
      contentSafety: false
      semanticChecks: true
      templateId: hallucinations
      safetyInstructions: 'Review substantive answers for material internal contradictions, explicitly
        invented sources presented as real, and conclusions that contradict evidence quoted in the
        answer. Do not block merely because an answer has no citation. Allow greetings, ordinary
        factual answers, clearly labeled estimates, opinions, and creative writing. Flag unsupported
        claims of verification only when the answer itself provides evidence of fabrication. You only
        see the answer: do not assume access to retrieved documents or external facts, and do not
        claim to have independently verified them.'
      deniedTerms: []
      blockedTopics: []
      deniedTools: []
      argumentRules: []
      blockMessage: The answer did not pass the evidence check. Provide supporting sources or qualify
        uncertain claims.
      enabled: true
