# NeMo Guardrails configuration for the OpenHarness policy adapter.
# Requires the bundled openharness rails.co and actions.py.
# Edit custom_data.openharness.policy; model credentials stay on the service.
models: []
colang_version: "1.0"
rails:
  input:
    flows:
      - openharness policy
  dialog:
    user_messages:
      embeddings_only: true
custom_data:
  openharness:
    version: 1
    policy:
      name: PII presence policy
      description: Mask email addresses, US Social Security numbers, and payment-card patterns.
      provider: builtin
      configId: openharness
      stages:
        - input
        - output
        - retrieval
        - tool_input
        - tool_output
      failMode: closed
      timeoutMs: 5000
      latencyBudgetMs: 120000
      pii: true
      jailbreak: false
      contentSafety: false
      semanticChecks: false
      templateId: pii
      safetyInstructions: ""
      deniedTerms: []
      blockedTopics: []
      deniedTools: []
      argumentRules: []
      blockMessage: This request was blocked by the configured safety policy.
      enabled: true
