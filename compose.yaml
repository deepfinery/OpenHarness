# Existing installations keep their original project (and so their volumes) through COMPOSE_PROJECT_NAME in .env.
name: openharness

x-app-environment: &app-environment
  NODE_ENV: production
  PORT: 8088
  PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8088}
  MONGODB_URI: mongodb://agentic:${MONGO_PASSWORD:?Run ./start.sh first}@mongo:27017/agentic?authSource=admin
  MONGODB_DATABASE: agentic
  RABBITMQ_URL: amqp://agentic:${RABBITMQ_PASSWORD:?Run ./start.sh first}@rabbitmq:5672
  WEAVIATE_URL: http://weaviate:8080
  WEAVIATE_API_KEY: ${WEAVIATE_API_KEY:?Run ./start.sh first}
  # Optional Qdrant store: start with `--profile qdrant` and set QDRANT_URL=http://qdrant:6333 in .env.
  VECTOR_STORE: ${VECTOR_STORE:-weaviate}
  QDRANT_URL: ${QDRANT_URL:-}
  QDRANT_API_KEY: ${QDRANT_API_KEY:-}
  # Optional OpenSearch / Elasticsearch stores (profiles below, or a managed cluster) and any OpenAI-compatible
  # Vector Stores API (OpenAI, Llama Stack, managed services).
  OPENSEARCH_URL: ${OPENSEARCH_URL:-}
  OPENSEARCH_USERNAME: ${OPENSEARCH_USERNAME:-}
  OPENSEARCH_PASSWORD: ${OPENSEARCH_PASSWORD:-}
  ELASTICSEARCH_URL: ${ELASTICSEARCH_URL:-}
  ELASTICSEARCH_API_KEY: ${ELASTICSEARCH_API_KEY:-}
  OPENAI_VECTOR_STORES_URL: ${OPENAI_VECTOR_STORES_URL:-}
  OPENAI_VECTOR_STORES_API_KEY: ${OPENAI_VECTOR_STORES_API_KEY:-}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Run ./start.sh first}
  SETUP_TOKEN: ${SETUP_TOKEN:?Run ./start.sh first}
  DATA_DIR: /data
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
  MAX_ACTIVE_RUNS: ${MAX_ACTIVE_RUNS:-20}
  MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-20}
  LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-20}
  ALLOW_PRIVATE_URLS: ${ALLOW_PRIVATE_URLS:-false}
  ALLOWED_PRIVATE_HOSTS: ${ALLOWED_PRIVATE_HOSTS:-host.docker.internal,ollama,gateway}
  TRUST_PROXY: ${TRUST_PROXY:-0}
  # Device gateway: the api and runner reach it on the internal network; devices dial GATEWAY_PUBLIC_URL.
  GARAK_PROBES_URL: http://guardrail-evaluation:8001
  NEMO_GUARDRAILS_URL: ${NEMO_GUARDRAILS_URL:-http://guardrails:8000}
  GATEWAY_URL: http://gateway:8090
  GATEWAY_PUBLIC_URL: ${GATEWAY_PUBLIC_URL:-ws://localhost:8090}
  GATEWAY_API_TOKEN: ${GATEWAY_API_TOKEN:?Run ./start.sh --configure-only to add gateway credentials to .env}
  GATEWAY_ADMIN_TOKEN: ${GATEWAY_ADMIN_TOKEN:?Run ./start.sh --configure-only to add gateway credentials to .env}

services:
  storage-init:
    image: alpine:3.22
    user: root
    command:
      ['sh', '-c', 'mkdir -p /data/files && chown 1000:1000 /data /data/files && chmod 700 /data/files']
    volumes: ['files:/data']
    restart: 'no'

  api:
    build: .
    image: openharness:local
    init: true
    environment: *app-environment
    ports: ['${STUDIO_BIND:-127.0.0.1}:${STUDIO_PORT:-8088}:8088']
    # storage-init prepares the volume; skipping Docker's copy-up avoids a race when both services start at once.
    volumes: ['files:/data:nocopy']
    extra_hosts: ['host.docker.internal:host-gateway']
    depends_on:
      storage-init: { condition: service_completed_successfully }
      mongo: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      weaviate: { condition: service_healthy }
    restart: unless-stopped
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8088/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 8s
      retries: 10
      start_period: 30s

  runner:
    image: openharness:local
    pull_policy: never
    command: ['node', 'dist/apps/runner/src/worker.js']
    init: true
    environment: *app-environment
    volumes: ['files:/data:nocopy']
    extra_hosts: ['host.docker.internal:host-gateway']
    depends_on:
      storage-init: { condition: service_completed_successfully }
      mongo: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      weaviate: { condition: service_healthy }
    restart: unless-stopped
    stop_grace_period: 40s
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "const fs=require('fs');process.exit(Date.now()-Number(fs.readFileSync('/tmp/openharness-worker-heartbeat','utf8'))<20000?0:1)",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  gateway:
    build: { context: ., dockerfile: gateway/Dockerfile }
    image: openharness-gateway:local
    init: true
    environment:
      PORT: 8090
      GATEWAY_PUBLIC_URL: ${GATEWAY_PUBLIC_URL:-ws://localhost:8090}
      GATEWAY_API_TOKENS: orchestrator:${GATEWAY_API_TOKEN:?Run ./start.sh --configure-only to add gateway credentials to .env}
      GATEWAY_ADMIN_TOKEN: ${GATEWAY_ADMIN_TOKEN:?Run ./start.sh --configure-only to add gateway credentials to .env}
      # Registry and audit trail live in the stack's MongoDB, in their own database.
      GATEWAY_MONGODB_URI: mongodb://agentic:${MONGO_PASSWORD:?Run ./start.sh first}@mongo:27017/?authSource=admin
      GATEWAY_MONGODB_DATABASE: agentic_gateway
      GATEWAY_AUDIT_RETENTION_DAYS: ${GATEWAY_AUDIT_RETENTION_DAYS:-90}
      # TLS terminates at your reverse proxy (see gateway/Caddyfile); set to false once it forwards X-Forwarded-Proto.
      GATEWAY_ALLOW_INSECURE_WS: ${GATEWAY_ALLOW_INSECURE_WS:-true}
      GATEWAY_TOOL_TIMEOUT_SECONDS: ${GATEWAY_TOOL_TIMEOUT_SECONDS:-120}
      GATEWAY_APPROVAL_TOOLS: ${GATEWAY_APPROVAL_TOOLS:-}
      GATEWAY_APPROVAL_PROVIDER: ${GATEWAY_APPROVAL_PROVIDER:-noop}
      GATEWAY_APPROVAL_URL: ${GATEWAY_APPROVAL_URL:-}
      TRUST_PROXY: ${TRUST_PROXY:-0}
    ports: ['${GATEWAY_BIND:-0.0.0.0}:${GATEWAY_PORT:-8090}:8090']
    depends_on:
      mongo: { condition: service_healthy }
    restart: unless-stopped
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8090/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  guardrail-evaluation:
    profiles: [safety-evaluation]
    build:
      context: .
      dockerfile: guardrails/evaluation/Dockerfile
    image: openharness-garak-probes:0.17.0
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 1

  guardrails:
    profiles: [guardrails]
    build:
      context: .
      dockerfile: guardrails/Dockerfile
    image: openharness-guardrails:0.24.1
    restart: unless-stopped
    environment:
      NEMO_GUARDRAILS_NO_USAGE_STATS: '1'
      DO_NOT_TRACK: '1'
      NEMO_SAFETY_MODEL_URL: ${NEMO_SAFETY_MODEL_URL:-}
      NEMO_SAFETY_MODEL: ${NEMO_SAFETY_MODEL:-}
      NEMO_SAFETY_MODEL_KEY: ${NEMO_SAFETY_MODEL_KEY:-local}
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 2g
    cpus: 2

  mongo:
    image: mongo:7.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: agentic
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?Run ./start.sh first}
    volumes: ['mongodb:/data/db']
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mongosh --quiet --username agentic --password "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval ''quit(db.adminCommand({ping:1}).ok ? 0 : 1)'' >/dev/null',
        ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: agentic
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Run ./start.sh first}
    volumes: ['rabbitmq:/var/lib/rabbitmq']
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.36.6
    environment:
      QUERY_DEFAULTS_LIMIT: 20
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'false'
      AUTHENTICATION_APIKEY_ENABLED: 'true'
      AUTHENTICATION_APIKEY_ALLOWED_KEYS: ${WEAVIATE_API_KEY:?Run ./start.sh first}
      AUTHENTICATION_APIKEY_USERS: agentic
      AUTHORIZATION_ADMINLIST_ENABLED: 'true'
      AUTHORIZATION_ADMINLIST_USERS: agentic
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: none
      CLUSTER_HOSTNAME: node1
      DISABLE_TELEMETRY: 'true'
      AUTOSCHEMA_ENABLED: 'false'
      LIMIT_RESOURCES: 'true'
      GOMEMLIMIT: 512MiB
    volumes: ['weaviate:/var/lib/weaviate']
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:8080/v1/.well-known/ready']
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  qdrant:
    image: qdrant/qdrant:v1.19.1
    profiles: ['qdrant']
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
      # Qdrant sends anonymous usage statistics unless this is set.
      QDRANT__TELEMETRY_DISABLED: 'true'
    volumes: ['qdrant:/qdrant/storage']
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'bash', '-c', ':> /dev/tcp/127.0.0.1/6333']
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 10s

  # Local single-node search engines for evaluation, reachable only on the Compose network. For production, point
  # OPENSEARCH_URL or ELASTICSEARCH_URL at a secured or managed cluster instead.
  opensearch:
    image: opensearchproject/opensearch:3.8.0
    profiles: ['opensearch']
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: 'true'
      DISABLE_INSTALL_DEMO_CONFIG: 'true'
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    volumes: ['opensearch:/usr/share/opensearch/data']
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -fs http://127.0.0.1:9200/_cluster/health | grep -Eq "\"status\":\"(green|yellow)\""',
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.4
    profiles: ['elasticsearch']
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes: ['elasticsearch:/usr/share/elasticsearch/data']
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -fs http://127.0.0.1:9200/_cluster/health | grep -Eq "\"status\":\"(green|yellow)\""',
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  mongodb:
  rabbitmq:
  weaviate:
  qdrant:
  opensearch:
  elasticsearch:
  files:
